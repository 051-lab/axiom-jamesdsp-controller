name: Windows CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure native console and tests
        run: >-
          cmake -S AxiomConsoleHarness -B build-axiom-console
          -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build native console and tests
        run: cmake --build build-axiom-console --config Release

      - name: Run native LiveProg and Darwin tests
        run: ctest --test-dir build-axiom-console -C Release --output-on-failure

      - name: Build controller
        run: dotnet build AxiomConsoleHarness/AxiomJamesDSPController/AxiomJamesDSPController.csproj --configuration Release

      - name: Run controller metadata and package tests
        run: dotnet test AxiomConsoleHarness/AxiomJamesDSPController.Tests/AxiomJamesDSPController.Tests.csproj --configuration Release
